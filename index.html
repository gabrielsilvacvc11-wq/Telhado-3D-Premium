<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telhado 3D Premium</title>
<meta name="description" content="Simulador fotovoltaico em 3D: monte o telhado, posicione os módulos e veja o sol e as sombras.">
<meta name="theme-color" content="#0c0d0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f5b53d'/%3E%3C/svg%3E">
<style>
:root{--bg:#0c0d0e;--pn:#15181b;--ln:#2a3036;--fg:#eef1f3;--mut:#8f9aa3;--acc:#f5b53d;--ok:#4cc38a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;left:12px;top:12px;bottom:12px;width:318px;overflow:auto;background:rgba(21,24,27,.93);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:16px;padding:14px;z-index:2}
#hd{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
#hd h1{font-size:17px;margin:0;letter-spacing:-.01em}
#hd small{display:block;color:var(--mut);font-size:12px;font-weight:400}
h2{font-size:12px;color:var(--mut);margin:16px 0 6px;font-weight:600}
.btn{border:1px solid var(--ln);background:#1d2226;color:var(--fg);border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.on{background:var(--acc);border-color:var(--acc);color:#1b1405;font-weight:600}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid .btn{border-radius:10px;text-align:center;padding:9px 6px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.row b{font-weight:600;font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;accent-color:var(--acc);margin:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:#1b2024;border-radius:10px;padding:8px 10px}
.stats span{display:block;color:var(--mut);font-size:11px}
.stats b{font-size:17px;font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:11.5px;margin:10px 0 0}
.hide{display:none!important}
@media(max-width:760px){
 #ui{left:0;right:0;top:auto;bottom:0;width:auto;max-height:50vh;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 #ui.min{max-height:62px;overflow:hidden}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="ui">
 <div id="hd">
  <h1>Telhado 3D<small>Simulador fotovoltaico</small></h1>
  <button class="btn on" id="bReal" aria-pressed="true">Realista</button>
  <button class="btn" id="bMin" aria-label="Recolher painel">▾</button>
 </div>
 <div id="body"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),V=(x,y,z)=>new THREE.Vector3(x,y,z),RAD=Math.PI/180;
const S={kind:'gable',W:10,D:8,H:3,pitch:30,yaw:0,qty:Infinity,N:true,Sul:false,t:.5,play:false,real:true,
 nb:false,nbKind:'house',nbSide:'N',nbH:9,nbGap:5,watt:610};
const DEF={gable:[10,8,3,30],hip:[10,10,3,25],warehouse:[16,22,5.2,12],hidden:[10,8.5,3.15,8],flat:[10,12,3,22],ground:[14,16,0,28]};
const NAMES={gable:'Duas águas',hip:'Quatro águas',warehouse:'Galpão',hidden:'Embutido',flat:'Laje plana',ground:'Solo'};

/* ---------- renderer, cena, câmera ---------- */
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,900);
cam.position.set(16,10,18);
const ctl=new THREE.OrbitControls(cam,R.domElement);
ctl.enableDamping=true;ctl.target.set(0,2,0);ctl.maxPolarAngle=Math.PI*.495;ctl.minDistance=3;ctl.maxDistance=95;
let goal=null,look=V(0,2,0);ctl.addEventListener('start',()=>goal=null);

/* ---------- céu, luzes, ambiente ---------- */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{sun:{value:V(0,1,0)},top:{value:new THREE.Color('#2f6fb5')},hor:{value:new THREE.Color('#bcd4e6')}},
 vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;uniform vec3 sun,top,hor;void main(){float h=clamp(p.y,0.,1.);vec3 c=mix(hor,top,pow(h,.5));float s=max(dot(normalize(p),sun),0.);c+=vec3(1.,.82,.55)*(pow(s,700.)*3.+pow(s,10.)*.22);gl_FragColor=vec4(c,1.);}'});
const skyM=new THREE.Mesh(new THREE.SphereGeometry(420,24,12),skyMat);skyM.frustumCulled=false;scene.add(skyM);
const envScene=new THREE.Scene();envScene.add(new THREE.Mesh(new THREE.SphereGeometry(60,16,8),skyMat));
const pmrem=new THREE.PMREMGenerator(R);let envRT=null,envStamp=0;
const hemi=new THREE.HemisphereLight('#dbe8f5','#6a5c48',.3);scene.add(hemi);
const sunL=new THREE.DirectionalLight('#fff1d6',3);sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);Object.assign(sunL.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:220});
sunL.shadow.camera.updateProjectionMatrix();sunL.shadow.bias=-.0004;sunL.shadow.normalBias=.03;scene.add(sunL,sunL.target);
const fog=new THREE.Fog('#bcd4e6',70,330);

/* ---------- texturas procedurais ---------- */
function ct(w,h,f,lin){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,R.capabilities.getMaxAnisotropy());
 t.encoding=lin?THREE.LinearEncoding:THREE.sRGBEncoding;return t}
const rnd=Math.random;
const tileDraw=(bump)=>(g,w,h)=>{g.fillStyle=bump?'#222':'#4a241c';g.fillRect(0,0,w,h);const rh=h/12,cw=w/8,tn=['#a35a44','#93493a','#85402f','#ab6249','#7a3a2c','#995440'];
 for(let y=0;y<12;y++)for(let x=-1;x<9;x++){const px=x*cw+(y%2)*cw/2+1,py=y*rh+1,tw=cw-3,th=rh-2.5;
  if(bump){const l=g.createLinearGradient(0,py,0,py+th);l.addColorStop(0,'#555');l.addColorStop(.75,'#bbb');l.addColorStop(1,'#fff');g.fillStyle=l;g.fillRect(px,py,tw,th)}
  else{g.fillStyle=tn[(x+y*3+(y%4)+8)%6];g.fillRect(px,py,tw,th);g.fillStyle='rgba(255,215,170,.14)';g.fillRect(px,py,tw,th*.3);g.fillStyle='rgba(40,12,8,.28)';g.fillRect(px,py+th*.72,tw,th*.28)}}};
const tileTex=ct(256,256,tileDraw(false)),tileBump=ct(256,256,tileDraw(true),1);
const plaster=ct(128,128,(g,w,h)=>{g.fillStyle='#ece6d8';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(140,120,95,${rnd()*.08})`;g.fillRect(rnd()*w,rnd()*h,2,2)}});
const metalTex=ct(256,64,(g,w,h)=>{for(let x=0;x<16;x++){g.fillStyle=x%2?'#858b92':'#979da4';g.fillRect(x*16,0,16,h);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x*16+2,0,3,h)}});
const grassTex=ct(512,512,(g,w,h)=>{g.fillStyle='#5d7b3d';g.fillRect(0,0,w,h);for(let i=0;i<w*6;i++){g.fillStyle=`hsla(${85+rnd()*30},${35+rnd()*25}%,${30+rnd()*24}%,${.12+rnd()*.25})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,2+rnd()*5)}});
const grassBump=ct(256,256,(g,w,h)=>{g.fillStyle='#777';g.fillRect(0,0,w,h);for(let i=0;i<w*8;i++){const v=80+rnd()*150|0;g.fillStyle=`rgba(${v},${v},${v},.5)`;g.fillRect(rnd()*w,rnd()*h,1,2+rnd()*3)}},1);
[grassTex,grassBump].forEach(t=>t.repeat.set(180,180));
const asphalt=ct(128,128,(g,w,h)=>{g.fillStyle='#3b3d40';g.fillRect(0,0,w,h);for(let i=0;i<700;i++){const v=50+rnd()*50|0;g.fillStyle=`rgb(${v},${v},${v+2})`;g.fillRect(rnd()*w,rnd()*h,2,2)}});asphalt.repeat.set(60,2);
const panelTex=ct(480,230,(g,w,h)=>{g.fillStyle='#c9d0d8';g.fillRect(0,0,w,h);g.fillStyle='#08182b';g.fillRect(7,7,w-14,h-14);
 const cw=(w-24)/12,ch=(h-24)/6;for(let r=0;r<6;r++)for(let c=0;c<12;c++){const x=12+c*cw,y=12+r*ch,l=g.createLinearGradient(x,y,x+cw,y+ch);l.addColorStop(0,'#1d4f86');l.addColorStop(.5,'#0d2c52');l.addColorStop(1,'#184472');g.fillStyle=l;g.fillRect(x+1.5,y+1.5,cw-3,ch-3);
  g.fillStyle='rgba(190,205,225,.45)';for(let k=1;k<4;k++)g.fillRect(x+k*cw/4-.4,y+1.5,.8,ch-3)}});
panelTex.wrapS=panelTex.wrapT=THREE.ClampToEdgeWrapping;
const bTex=ct(128,128,(g,w,h)=>{g.fillStyle='#cdc6ba';g.fillRect(0,0,w,h);for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle='#40627c';g.fillRect(x*32+7,y*32+8,18,15)}});

/* ---------- materiais ---------- */
const mk=(o)=>new THREE.MeshStandardMaterial(Object.assign({side:THREE.DoubleSide},o));
const M={tile:mk({map:tileTex,roughness:.75}),wall:mk({map:plaster,roughness:.9}),metalWall:mk({map:metalTex,color:'#aab1b8',roughness:.5,metalness:.4}),
 metal:mk({map:metalTex,color:'#8d949b',roughness:.4,metalness:.5}),memb:mk({color:'#5b5f64',roughness:.92}),
 panel:mk({map:panelTex,roughness:.12,metalness:.45}),rail:mk({color:'#454d57',roughness:.4,metalness:.7}),
 glass:mk({color:'#9ec3d8',roughness:.05,metalness:.5,transparent:true,opacity:.78}),wood:mk({color:'#5e3822',roughness:.7}),
 frame:mk({color:'#2a3138',roughness:.45}),base:mk({color:'#b3ada2',roughness:.92}),cap:mk({color:'#6b3225',roughness:.55}),
 grass:mk({color:'#6d8a4a',roughness:1}),nbWall:mk({map:plaster,color:'#c9bcad',roughness:.9}),bld:mk({map:bTex,roughness:.7}),
 trunk:mk({color:'#5a3a24',roughness:.95}),leaf:mk({color:'#3f6a38',roughness:.9}),leaf2:mk({color:'#547f38',roughness:.9}),road:mk({map:asphalt,roughness:.95})};

/* ---------- chão e cenário ---------- */
const ground=new THREE.Mesh(new THREE.CircleGeometry(330,48),M.grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const house=new THREE.Group(),nbG=new THREE.Group(),deco=new THREE.Group();scene.add(house,nbG,deco);
function tree(h,mat2){const g=new THREE.Group(),th=h*.38;
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.14*h/5,.24*h/5,th,7),M.trunk);t.position.y=th/2;t.castShadow=true;g.add(t);
 [[0,0,0,.3],[.5,-.15,.2,.22],[-.45,-.25,-.15,.2]].forEach(([x,y,z,r],i)=>{const c=new THREE.Mesh(new THREE.IcosahedronGeometry(h*r,1),i%2?M.leaf2:M.leaf);c.position.set(x*h*.4,th+h*.2+y*h,z*h*.4);c.castShadow=true;g.add(c)});return g}
for(let i=0;i<22;i++){const a=i/22*6.283+((i*37)%11)*.09,r=48+((i*53)%19),t=tree(5+((i*29)%9)*.45);t.position.set(Math.cos(a)*r,0,Math.sin(a)*r);deco.add(t)}
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,7),M.road);road.rotation.x=-Math.PI/2;road.position.set(0,.02,-34);road.receiveShadow=true;deco.add(road);
const walk=new THREE.Mesh(new THREE.PlaneGeometry(400,2),M.base);walk.rotation.x=-Math.PI/2;walk.position.set(0,.03,-29.5);walk.receiveShadow=true;deco.add(walk);

/* ---------- helpers de geometria ---------- */
function put(m,par){m.castShadow=m.receiveShadow=true;(par||house).add(m);return m}
function box(par,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return put(m,par)}
function poly(P,mat,sc,par){const n=new THREE.Vector3().subVectors(P[1],P[0]).cross(new THREE.Vector3().subVectors(P[2],P[0])).normalize();
 const e1=new THREE.Vector3().subVectors(P[1],P[0]).normalize(),e2=new THREE.Vector3().crossVectors(n,e1),pos=[],uv=[],idx=[];
 P.forEach(p=>{pos.push(p.x,p.y,p.z);uv.push(p.dot(e1)/sc,p.dot(e2)/sc)});
 for(let i=1;i<P.length-1;i++)idx.push(0,i,i+1);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
 return put(new THREE.Mesh(g,mat),par)}
function clear(g){while(g.children.length){const c=g.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose()})}}
function face(id,A,f0,f1){const bm=A[0].clone().add(A[1]).multiplyScalar(.5),tm=A[2].clone().add(A[3]).multiplyScalar(.5),sv=tm.clone().sub(bm),len=sv.length(),s=sv.normalize();
 const u=A[1].clone().sub(A[0]).normalize(),n=new THREE.Vector3().crossVectors(u,s).normalize();if(n.y<0)n.negate();
 const bw=A[0].distanceTo(A[1]),tw=A[2].distanceTo(A[3]);
 return{id,u,s,n,c:bm.clone().addScaledVector(s,len*(f0+f1)/2),hu:(bw+(tw-bw)*f1)/2,hv:len*(f1-f0)/2}}

/* ---------- construção da casa ---------- */
let NS=[],MAXQ=0,F=[];
function build(){
 clear(house);F=[];const {kind,W,D,H,pitch}=S,t=Math.tan(pitch*RAD),d=D/2,table=kind==='flat'||kind==='ground';
 const wallM=kind==='warehouse'?M.metalWall:M.wall;
 if(!table||kind==='flat'){
  box(house,W,H,D,0,H/2,0,wallM);box(house,W+.3,.18,D+.3,0,.09,0,M.base);
  [1,-1].forEach(k=>{[-.28,.28].forEach(x=>{box(house,Math.min(1.5,W*.2)+.1,1.18,.07,x*W,1.65,k*(d+.02),M.frame);box(house,Math.min(1.5,W*.2),1.08,.04,x*W,1.65,k*(d+.045),M.glass)})});
  box(house,1.1,2.1,.08,0,1.1,-d-.04,M.wood);box(house,.08,.16,.05,.34,1.1,-d-.09,M.frame)}
 const gable=(ov,mat,cap)=>{const xe=W/2+ov,ze=d+ov,ye=H-t*ov,yr=H+t*d;
  [[1,'N'],[-1,'S']].forEach(([k,id])=>{const A=[V(-xe,ye,k*ze),V(xe,ye,k*ze),V(xe,yr,0),V(-xe,yr,0)];poly(A,mat,2.4);F.push(face(id,A,.04,.96))});
  [-1,1].forEach(k=>poly([V(k*W/2,H,-d),V(k*W/2,H,d),V(k*W/2,yr,0)],wallM,3));
  if(cap)box(house,W+2*ov,.09,.3,0,yr+.03,0,M.cap)};
 if(kind==='gable')gable(.5,M.tile,1);
 else if(kind==='warehouse')gable(.3,M.metal,0);
 else if(kind==='hidden'){gable(0,M.memb,0);const ph=.9;
  [1,-1].forEach(k=>{box(house,W+.4,ph,.2,0,H+ph/2,k*(d+.1),M.wall);box(house,.2,ph,D,k*(W/2+.1),H+ph/2,0,M.wall)});}
 else if(kind==='hip'){const ov=.5,xe=W/2+ov,ze=d+ov,ye=H-t*ov,yr=H+t*d,L=Math.max(W-D,.2);
  [[1,'N'],[-1,'S']].forEach(([k,id])=>{const A=[V(-xe,ye,k*ze),V(xe,ye,k*ze),V(L/2,yr,0),V(-L/2,yr,0)];poly(A,M.tile,2.4);F.push(face(id,A,.05,.7))});
  poly([V(xe,ye,ze),V(xe,ye,-ze),V(L/2,yr,0)],M.tile,2.4);poly([V(-xe,ye,-ze),V(-xe,ye,ze),V(-L/2,yr,0)],M.tile,2.4);
  box(house,L,.09,.3,0,yr+.03,0,M.cap)}
 else{ // laje plana e solo: mesa inclinada para o norte
  const flat=kind==='flat',base=flat?H+.25:0,p=pitch*RAD,cp=Math.cos(p),sp=Math.sin(p),avail=flat?D-1.2:D,hv=Math.min(avail/(2*cp),12),hu=(flat?W-1.2:W)/2,y0=base+.4;
  if(flat){box(house,W+.3,.25,D+.3,0,H+.125,0,M.base);[1,-1].forEach(k=>{box(house,W+.3,.45,.15,0,H+.47,k*(d+.07),M.wall);box(house,.15,.45,D,k*(W/2+.07),H+.47,0,M.wall)})}
  else box(house,W+1,.05,D+1,0,.025,0,M.base);
  const np=Math.max(2,Math.ceil(2*hu/3)+1),top=y0+2*hv*sp;
  for(let i=0;i<np;i++){const x=-hu+i*2*hu/(np-1);box(house,.09,top-base,.09,x,base+(top-base)/2,-hv*cp,M.rail);box(house,.09,y0-base,.09,x,base+(y0-base)/2,hv*cp,M.rail)}
  F.push({id:'T',u:V(1,0,0),s:V(0,sp,-cp),n:V(0,cp,sp),c:V(0,y0+hv*sp,0),hu,hv})}
 // módulos
 const pw=2.38,ph=1.134,g=.025,slots=[];
 F.forEach(f=>{f.sel=f.id==='T'||(f.id==='N'?S.N:S.Sul);if(!f.sel)return;
  const nu=Math.floor((2*f.hu-.5+g)/(pw+g)),nv=Math.floor((2*f.hv-.5+g)/(ph+g));
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++)slots.push({f,j,nu,key:f.id+j,p:f.c.clone().addScaledVector(f.u,(i+.5-nu/2)*(pw+g)).addScaledVector(f.s,(j+.5-nv/2)*(ph+g)).addScaledVector(f.n,.11),
   row:f.c.clone().addScaledVector(f.s,(j+.5-nv/2)*(ph+g)).addScaledVector(f.n,.055)})});
 MAXQ=slots.length;const n=Math.min(S.qty,MAXQ);NS=[];
 if(n>0){const im=new THREE.InstancedMesh(new THREE.BoxGeometry(pw,.04,ph),M.panel,n),m4=new THREE.Matrix4(),rows=new Map();
  for(let k=0;k<n;k++){const s=slots[k],w=new THREE.Vector3().crossVectors(s.f.u,s.f.n);m4.makeBasis(s.f.u,s.f.n,w).setPosition(s.p);im.setMatrixAt(k,m4);
   NS.push(s.f.n.clone().applyAxisAngle(V(0,1,0),S.yaw*RAD));const r=rows.get(s.key)||{s,c:0};r.c++;rows.set(s.key,r)}
  put(im);
  rows.forEach(({s,c})=>{const w=new THREE.Vector3().crossVectors(s.f.u,s.f.n),q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(s.f.u,s.f.n,w));
   [-.3,.3].forEach(o=>{const m=box(house,c*(pw+g),.05,.06,0,0,0,M.rail);m.position.copy(s.row).addScaledVector(w,o);m.quaternion.copy(q)})})}
 house.rotation.y=S.yaw*RAD;buildNb();sync();
}
function buildNb(){
 clear(nbG);nbG.visible=S.nb;if(!S.nb)return;const k=S.nbKind,h=S.nbH,y=S.yaw*RAD;
 const w=k==='tree'?4:k==='building'?Math.max(9,S.W*.7):Math.max(8,S.W*.85),dd=k==='tree'?4:Math.max(7,S.D*(k==='building'?.55:.75)),g=new THREE.Group();
 if(k==='tree')g.add(tree(h));
 else{box(g,w,h,dd,0,h/2,0,k==='building'?M.bld:M.nbWall);
  if(k==='building'){bTex.repeat.set(w/4,h/4);box(g,w+.3,.25,dd+.3,0,h+.12,0,M.memb)}
  else{const rise=Math.tan(27*RAD)*dd/2,hw=w/2+.3,hd=dd/2+.3,yr=h+rise;
   poly([V(-hw,h,-hd),V(hw,h,-hd),V(hw,yr,0),V(-hw,yr,0)],M.tile,2.4,g);
   poly([V(-hw,h,hd),V(hw,h,hd),V(hw,yr,0),V(-hw,yr,0)],M.tile,2.4,g);box(g,w+.6,.09,.3,0,yr+.03,0,M.cap)}}
 const ex=Math.abs(S.W/2*Math.cos(y))+Math.abs(S.D/2*Math.sin(y)),ez=Math.abs(S.W/2*Math.sin(y))+Math.abs(S.D/2*Math.cos(y)),gap=S.nbGap;
 if(S.nbSide==='N')g.position.z=ez+gap+dd/2;else if(S.nbSide==='S')g.position.z=-(ez+gap+dd/2);
 else if(S.nbSide==='L')g.position.x=ex+gap+w/2;else g.position.x=-(ex+gap+w/2);
 nbG.add(g)}

/* ---------- sol ---------- */
const sunDir=t=>{const a=t*Math.PI,e=(6+54*Math.sin(a))*RAD;return V(Math.cos(a)*Math.cos(e),Math.sin(e),Math.sin(a)*Math.cos(e))};
const cLo=new THREE.Color('#ff9a55'),cHi=new THREE.Color('#fff1d6'),hLo=new THREE.Color('#e9b48a'),hHi=new THREE.Color('#bcd4e6'),tLo=new THREE.Color('#4b6a99'),tHi=new THREE.Color('#2f6fb5');
function updateSun(){const s=sunDir(S.t),e=Math.max(s.y,0),k=Math.min(1,e*2.6);
 sunL.position.copy(s).multiplyScalar(80);sunL.intensity=S.real?.2+3.1*Math.pow(e,.45):1.5;sunL.color.copy(cLo).lerp(cHi,k);
 skyMat.uniforms.sun.value.copy(s);skyMat.uniforms.hor.value.copy(hLo).lerp(hHi,k);skyMat.uniforms.top.value.copy(tLo).lerp(tHi,k);fog.color.copy(skyMat.uniforms.hor.value);
 R.toneMappingExposure=S.real?.78+.25*k:1;
 if(S.real){const now=performance.now();if(now-envStamp>180){envStamp=now;const rt=pmrem.fromScene(envScene,0,1,200);envRT&&envRT.dispose();envRT=rt;scene.environment=rt.texture}}
 stats()}
function stats(){const n=NS.length,kwp=n*S.watt/1000,s=sunDir(S.t),irr=t=>Math.pow(Math.sin(t*Math.PI),.6);let now=0,day=0;
 NS.forEach(v=>{now+=Math.max(0,v.dot(s))*irr(S.t);for(let k=0;k<=24;k++){const tt=k/24;day+=Math.max(0,v.dot(sunDir(tt)))*irr(tt)*.5}});
 const f=S.watt/1000*.82;$('#sMod').textContent=n+' / '+MAXQ;$('#sKwp').textContent=kwp.toFixed(2)+' kWp';$('#sNow').textContent=(now*f).toFixed(2)+' kW';$('#sDay').textContent=(day*f).toFixed(1)+' kWh';$('#sArea').textContent=(n*2.38*1.134).toFixed(0)+' m²'}
function sync(){if(SL.qty){SL.qty.i.max=MAXQ;SL.qty.i.value=Math.min(S.qty,MAXQ);SL.qty.show()}stats()}

/* ---------- modo realista / simples ---------- */
function applyReal(){const r=S.real;R.shadowMap.enabled=r;sunL.castShadow=r;hemi.intensity=r?.3:.85;R.toneMapping=r?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;
 scene.fog=r?fog:null;skyM.visible=r;scene.background=r?null:new THREE.Color('#9db7c9');if(!r)scene.environment=null;deco.visible=r;
 M.tile.bumpMap=M.nbWall.bumpMap=r?tileBump:null;M.tile.bumpScale=3;M.nbWall.bumpMap=null;M.wall.bumpMap=r?plaster:null;M.wall.bumpScale=.8;
 M.grass.map=r?grassTex:null;M.grass.bumpMap=r?grassBump:null;M.grass.bumpScale=1.5;M.grass.color.set(r?'#ffffff':'#6d8a4a');
 [M.panel,M.glass,M.metal,M.metalWall,M.rail].forEach(m=>m.envMapIntensity=r?1.8:0);
 Object.values(M).forEach(m=>m.needsUpdate=true);$('#bReal').classList.toggle('on',r);$('#bReal').setAttribute('aria-pressed',r);
 $('#bReal').textContent=r?'Realista':'Simples';updateSun()}

/* ---------- interface ---------- */
const SL={};
function slider(box,key,label,min,max,step,fmt,fn){const r=document.createElement('label');r.className='row';r.innerHTML='<span>'+label+'</span><b></b><input type=range min='+min+' max='+max+' step='+step+'>';
 const i=r.querySelector('input'),b=r.querySelector('b'),show=()=>b.textContent=fmt(Math.min(S[key],+i.max));i.value=S[key];show();
 i.oninput=()=>{S[key]=+i.value;show();fn()};box.append(r);SL[key]={r,i,show};return r}
const un=(u,d=0)=>v=>(+v).toFixed(d)+u,hour=v=>{const h=6+v*12;return String(h|0).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0')};
function buttons(box,items,cur,fn,cls){const w=document.createElement('div');w.className=cls||'grid';items.forEach(([id,t])=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=()=>{fn(id);[...w.children].forEach(c=>c.classList.toggle('on',c===b))};if(id===cur)b.classList.add('on');w.append(b)});box.append(w);return w}
function sec(t){const h=document.createElement('h2');h.textContent=t;B.append(h)}
const B=$('#body');
sec('Modelo do telhado');
buttons(B,Object.entries(NAMES),S.kind,k=>{S.kind=k;[S.W,S.D,S.H,S.pitch]=DEF[k];S.qty=Infinity;['W','D','H','pitch'].forEach(x=>{SL[x].i.value=S[x];SL[x].show()});
 SL.H.r.classList.toggle('hide',k==='ground');faceBox.classList.toggle('hide',k==='flat'||k==='ground');build();updateSun();view('orb')});
slider(B,'W','Largura',4,30,.5,un(' m',1),build);slider(B,'D','Comprimento',4,30,.5,un(' m',1),build);slider(B,'H','Altura da parede',2,8,.1,un(' m',1),build);
slider(B,'pitch','Inclinação',5,45,1,un('°'),build);slider(B,'yaw','Orientação (giro da casa)',0,359,1,un('°'),()=>{build();updateSun()});
sec('Módulos de '+S.watt+' W');
slider(B,'qty','Quantidade',0,1,1,v=>v+' módulos',()=>{build()});
const faceBox=document.createElement('div');faceBox.className='grid';
[['N','Água norte'],['Sul','Água sul']].forEach(([k,t])=>{const b=document.createElement('button');b.className='btn'+(S[k]?' on':'');b.textContent=t;b.onclick=()=>{S[k]=!S[k];b.classList.toggle('on',S[k]);S.qty=Infinity;build()};faceBox.append(b)});B.append(faceBox);
sec('Sol');
const playB=document.createElement('button');playB.className='btn';playB.style.width='100%';playB.textContent='Simular o dia';
playB.onclick=()=>{S.play=!S.play;playB.classList.toggle('on',S.play);playB.textContent=S.play?'Pausar':'Simular o dia'};B.append(playB);
slider(B,'t','Hora do dia',.02,.98,.005,hour,()=>{S.play=false;playB.classList.remove('on');playB.textContent='Simular o dia';updateSun()});
sec('Vizinhança e sombra');
const nbB=document.createElement('button');nbB.className='btn';nbB.style.width='100%';nbB.textContent='Adicionar vizinho';
nbB.onclick=()=>{S.nb=!S.nb;nbB.classList.toggle('on',S.nb);nbB.textContent=S.nb?'Remover vizinho':'Adicionar vizinho';nbBox.classList.toggle('hide',!S.nb);buildNb()};B.append(nbB);
const nbBox=document.createElement('div');nbBox.className='hide';B.append(nbBox);
buttons(nbBox,[['house','Casa'],['building','Prédio'],['tree','Árvore']],S.nbKind,k=>{S.nbKind=k;S.nbH=k==='building'?14:k==='tree'?10:9;SL.nbH.i.value=S.nbH;SL.nbH.show();buildNb()},'grid').style.cssText='grid-template-columns:repeat(3,1fr);margin-top:8px';
buttons(nbBox,[['N','Norte'],['L','Leste'],['O','Oeste'],['S','Sul']],S.nbSide,k=>{S.nbSide=k;buildNb()},'grid').style.cssText='grid-template-columns:repeat(4,1fr);margin-top:6px';
slider(nbBox,'nbH','Altura',3,24,.5,un(' m',1),buildNb);slider(nbBox,'nbGap','Distância',1,20,.5,un(' m',1),buildNb);
sec('Câmera');
function view(n){const m=Math.max(S.W,S.D),y=S.kind==='ground'?.8:S.H*.6+1;
 const p={orb:[m*1.05+5,m*.62+4,m*1.05+6],top:[.1,m*2.2+8,.1],north:[0,S.H+4,m*1.5+9],side:[m*1.6+8,S.H+3,0]}[n];goal=V(...p);look.set(0,y,0)}
buttons(B,[['orb','Órbita'],['top','Topo'],['north','Norte'],['side','Lado']],'',view,'grid').style.cssText='grid-template-columns:repeat(4,1fr)';
sec('Resultado');
const st=document.createElement('div');st.className='stats';
st.innerHTML='<div><span>Módulos</span><b id=sMod></b></div><div><span>Potência instalada</span><b id=sKwp></b></div><div><span>Potência agora</span><b id=sNow></b></div><div><span>Geração no dia</span><b id=sDay></b></div><div><span>Área ocupada</span><b id=sArea></b></div>';
B.append(st);
const nt=document.createElement('p');nt.className='note';nt.textContent='Estimativa com céu limpo e 82% de eficiência do sistema. A sombra do vizinho aparece na cena, mas ainda não reduz a geração calculada.';B.append(nt);
SL.H.r.classList.toggle('hide',S.kind==='ground');
$('#bReal').onclick=()=>{S.real=!S.real;applyReal()};
$('#bMin').onclick=()=>{const u=$('#ui');u.classList.toggle('min');$('#bMin').textContent=u.classList.contains('min')?'▴':'▾'};

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-(last||ts))/1000,.1);last=ts;
 if(S.play){S.t=.02+((S.t-.02+dt*.035)%.96);SL.t.i.value=S.t;SL.t.show();updateSun()}
 if(goal){const k=1-Math.exp(-dt*3);cam.position.lerp(goal,k);ctl.target.lerp(look,k);if(cam.position.distanceTo(goal)<.08)goal=null}
 ctl.update();R.render(scene,cam)}
build();applyReal();view('orb');requestAnimationFrame(loop);
</script>
</body>
</html>
